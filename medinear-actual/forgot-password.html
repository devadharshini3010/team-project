
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | MediNear</title>

    <link rel="stylesheet" href="forgot-password.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <header class="forgot-header">

        <a href="index.html" class="forgot-logo">
            <i class="fa-solid fa-heart-pulse"></i>
            <span>MediNear</span>
        </a>

        <a href="login.html" class="back-login">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Login
        </a>

    </header>


    <main class="forgot-main">

        <section class="forgot-card">

            <div class="forgot-icon">
                <i class="fa-solid fa-lock"></i>
            </div>

            <span class="forgot-eyebrow">ACCOUNT RECOVERY</span>

            <h1>Forgot your password?</h1>

            <p class="forgot-description">
                Don't worry. Enter the email address associated with
                your MediNear account and we'll help you reset your password.
            </p>


            <form id="forgot-password-form">

                <div class="forgot-field">

                    <label for="forgot-email">Email address</label>

                    <div class="forgot-input">
                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="forgot-email"
                            name="email"
                            placeholder="Enter your registered email"
                            autocomplete="email"
                            required
                        >
                    </div>

                </div>


                <p id="forgot-message"
                    class="forgot-message"
                    role="status"
                    aria-live="polite">
                </p>


                <button type="submit" class="reset-button">
                    Send Reset Link
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>


            <a href="login.html" class="return-login">
                <i class="fa-solid fa-arrow-left"></i>
                Return to Login
            </a>

        </section>

    </main>


    <footer class="forgot-footer">
        © 2026 MediNear. All rights reserved.
    </footer>


    <script src="forgot-password.js"></script>

</body>
</html>
